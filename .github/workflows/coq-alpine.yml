name: CI (Coq, Alpine)

on:
  push:
    branches: [ master , alpine-testing ]
  pull_request:
  merge_group:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - alpine: 'edge'
#        - alpine: 'latest-stable'

    runs-on: ubuntu-latest
    name: alpine-${{ matrix.alpine }}

    concurrency:
      group: ${{ github.workflow }}-alpine-${{ matrix.alpine }}-${{ github.event.pull_request.number || github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: host build params
      run: etc/ci/describe-system-config.sh
    - name: setup alpine
      run: |
        docker run -d --name alpine \
          -v "$HOME/work:$HOME/work" \
          -w "$GITHUB_WORKSPACE" \
          "alpine:${{ matrix.alpine }}" sleep infinity
        docker exec alpine sh -eux -c '
          echo https://dl-cdn.alpinelinux.org/alpine/edge/testing >> /etc/apk/repositories
          apk add --no-cache git make jq gcc musl-dev python3 ocaml ocaml-findlib ghc cabal rocq-stdlib ocaml-zarith bash
          grp="$(awk -F: -v g="$2" '\''$3 == g { print $1; exit }'\'' /etc/group)"
          if [ -z "$grp" ]; then addgroup -g "$2" "$1"; grp="$1"; fi
          adduser -u "$3" -G "$grp" -s /bin/sh -D "$1"
          if [ -d /etc/sudoers.d ]; then
            printf "%s ALL=(ALL) NOPASSWD: ALL\n" "$1" > /etc/sudoers.d/root
            chmod 0440 /etc/sudoers.d/root
          fi
          if [ -d /etc/doas.d ]; then
            printf "permit nopass keepenv %s\n" "$1" > /etc/doas.d/root.conf
            chmod 0600 /etc/doas.d/root.conf
          fi
        ' -- "$(id -un)" "$(id -g)" "$(id -u)"
        sudo tee /usr/local/bin/alpine.sh >/dev/null <<'EOF'
        #!/bin/sh
        exec docker exec -e CI -e GITHUB_ACTIONS -e GITHUB_STEP_SUMMARY -u "$(id -u):$(id -g)" -w "$(pwd)" alpine /bin/sh -eo pipefail "$@"
        EOF
        sudo chmod +x /usr/local/bin/alpine.sh
    - name: chroot build params
      shell: alpine.sh {0}
      run: etc/ci/describe-system-config.sh
    - name: make all
      shell: alpine.sh {0}
      run: etc/ci/github-actions-make.sh ALLOW_DIFF=1 -j2 all
    - name: make perf-Sanity
      shell: alpine.sh {0}
      run: etc/ci/github-actions-make.sh ALLOW_DIFF=1 -j2 perf-Sanity
    - name: display timing info
      run: cat time-of-build-pretty.log
    - name: display per-line timing info
      run: etc/ci/github-actions-display-per-line-timing.sh

  alpine-check-all:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
    - run: echo 'build passed'
      if: ${{ needs.build.result == 'success' }}
    - run: echo 'build failed' && false
      if: ${{ needs.build.result != 'success' }}
